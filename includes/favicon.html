<!-- ============================================================
     IEI Student Chapter — Favicon & App Icons
     File: includes/favicon.html
     Purpose: Reference copy. Paste into <head> of every page.
     NOTE: Favicons must be in <head> at parse time — do NOT
           load this file via the JS data-include loader.
     Paths are relative to the SITE ROOT.
     ============================================================ -->

<!-- Modern SVG icon (Chrome, Firefox, Edge prefer this) -->
<link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg">

<!-- PNG fallback for browsers without SVG icon support -->
<link rel="icon" type="image/png" sizes="96x96" href="assets/images/favicon/favicon-96x96.png">

<!-- Classic .ico fallback (legacy browsers, Windows shortcuts) -->
<link rel="shortcut icon" href="assets/images/favicon/favicon.ico">

<!-- Apple touch icon (iOS home screen bookmark) -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">

<!-- Android / PWA -->
<link rel="manifest" href="assets/images/favicon/site.webmanifest">

<!-- Theme colors (browser chrome tinting) -->
<meta name="theme-color" content="#00008B">

<!-- Microsoft tiles -->
<meta name="msapplication-TileColor" content="#00008B">
<meta name="msapplication-config" content="assets/images/favicon/browserconfig.xml">
